<title>What’s on Your Plate?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* One type scale for every page. A single base size follows the screen width;
   every role is a fixed multiple of it, so heading : subheading : copy always stays 2 : 0.8 : 1. */
:root {
  --type-base: clamp(1rem, 0.25rem + 4.1vw, 1.5rem);    /* about 20px on a 390px-wide phone, 24px at most */
  --size-copy: var(--type-base);                        /* dishes and button descriptions */
  --size-heading: calc(var(--type-base) * 2);           /* page title: What's on Your Plate? */
  --size-subheading: calc(var(--type-base) * 0.8);      /* section names and button names: STARTER, TODAY'S MENU */
  --track-subheading: .24em;
  --track-copy: .05em;
  --leading-copy: 1.3;
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* Layout: one printed menu card on a sage table, watercolour leaves in opposite corners, logo as the sign-off; editors get a quiet bar to rewrite it. */
:root {
  --table: #e2e5de;
  --paper: #f1f1ed;
  --field: #fafaf7;
  --ink: #1d1e1b;
  --ink-soft: #3b3c38;
  --ink-muted: #6c6f68;
  --line: #cfd3ca;
  --sage: #4f6b55;
  --sage-deep: #3d5643;
  --sage-wash: #e4ebe2;
  --gold: #b8962e;
  --alert: #8a3b2b;
  --f-display: "Playfair Display", "Bodoni 72", Didot, Georgia, serif;
  --f-body: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

html, body { min-height: 100%; }
body {
  background: var(--table);
  color: var(--ink);
  font-family: var(--f-body);
  -webkit-font-smoothing: antialiased;
}

.table {
  padding-block: clamp(16px, 5vw, 56px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.card {
  position: relative;
  overflow: hidden;
  max-width: 620px;
  margin-inline: auto;
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(40, 52, 40, .08), 0 14px 40px -18px rgba(40, 52, 40, .35);
  padding: clamp(118px, 30vw, 196px) clamp(22px, 7vw, 64px) clamp(40px, 9vw, 64px);
}

.leaf {
  position: absolute;
  pointer-events: none;
  background-repeat: no-repeat;
  background-size: contain;
}

.menu, .editor, .signoff { position: relative; z-index: 1; }

/* ---------- the printed menu ---------- */
.menu { text-align: center; }
.heading {
  margin: 0 auto clamp(40px, 10vw, 72px);
  max-width: 11ch;
  font-family: var(--f-display);
  font-style: italic;
  font-weight: 400;
  font-size: var(--size-heading);
  line-height: 1.12;
  letter-spacing: .01em;
  text-wrap: balance;
}
.courses { display: flex; flex-direction: column; gap: clamp(34px, 8vw, 54px); }
.course-name {
  margin: 0 0 clamp(14px, 3.5vw, 22px);
  padding-left: var(--track-subheading); /* balances the trailing letter-spacing so the word sits centred */
  font-family: var(--f-display);
  font-weight: 600;
  font-size: var(--size-subheading);
  letter-spacing: var(--track-subheading);
  text-transform: uppercase;
  color: var(--ink-soft);
}
.dishes {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: .5em;
}
/* Divider between dishes in the same section: two short lines with a gold dot. Sized in em so it scales with the text. */
.dishes li + li::before {
  content: "";
  display: block;
  width: 3.2em;
  height: .3em;
  margin: 0 auto .5em;
  background:
    radial-gradient(circle, var(--gold) 0 .11em, transparent .12em) center / .3em .3em no-repeat,
    linear-gradient(var(--line), var(--line)) left center / 1.15em 1px no-repeat,
    linear-gradient(var(--line), var(--line)) right center / 1.15em 1px no-repeat;
}
.dishes li {
  max-width: 30ch;
  margin-inline: auto;
  font-family: var(--f-body);
  font-style: italic;
  font-weight: 500;
  font-size: var(--size-copy);
  line-height: var(--leading-copy);
  letter-spacing: var(--track-copy);
  color: var(--ink-soft);
  text-wrap: balance;
}
.empty-note {
  font-style: italic;
  font-size: var(--size-copy);
  color: var(--ink-muted);
}

.signoff {
  display: flex;
  justify-content: center;
  margin-top: clamp(48px, 12vw, 84px);
}

<body>
<div class="table">
  <article class="card">
    <div class="leaf leaf-tl" aria-hidden="true"></div>
    <div class="leaf leaf-br" aria-hidden="true"></div>
    <div class="menu" id="menu" aria-live="polite">
      <p class="empty-note">Loading today’s menu…</p>
    </div>
    <footer class="signoff"><div class="logo" role="img" aria-label="Logo: the perfect pause"></div></footer>
  </article>
</div>
<script>
/* The dishes live in menu.txt next to this page. Edit that file on GitHub to change the menu. */
var PAGE_TITLE = 'What’s on Your Plate?';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* menu.txt: first line is the title, a line starting with # is a section, every other line is a dish. */
function parseMenu(text) {
  var lines = String(text).replace(/^﻿/, '').split(/\r?\n/);
  var heading = '', sections = [], cur = null;
  lines.forEach(function (raw) {
    var line = raw.trim();
    if (!line) return;
    if (line.charAt(0) === '#') {
      cur = { name: line.replace(/^#+\s*/, ''), dishes: [] };
      sections.push(cur);
      return;
    }
    if (!heading && !cur) { heading = line; return; }
    line = line.replace(/^[-*•]\s*/, '');
    if (!cur) { cur = { name: '', dishes: [] }; sections.push(cur); }
    cur.dishes.push(line);
  });
  return { heading: heading, sections: sections.filter(function (s) { return s.dishes.length; }) };
}

function renderMenu(d) {
  var out = '<h1 class="heading">' + esc(d.heading || PAGE_TITLE) + '</h1>';
  if (!d.sections.length) return out + '<p class="empty-note">Today’s menu is on its way.</p>';
  out += '<div class="courses">';
  d.sections.forEach(function (s) {
    out += '<section class="course">' +
      (s.name ? '<h2 class="course-name">' + esc(s.name) + '</h2>' : '') +
      '<ul class="dishes">' + s.dishes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '</section>';
  });
  return out + '</div>';
}

(function () {
  var menuEl = document.getElementById('menu');
  fetch('menu.txt?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      var d = parseMenu(t);
      menuEl.innerHTML = renderMenu(d);
      document.title = d.heading || PAGE_TITLE;
    })
    .catch(function () {
      menuEl.innerHTML = '<p class="empty-note">Today’s menu didn’t load. Refresh the page to try again.</p>';
    });
})();
</script>
